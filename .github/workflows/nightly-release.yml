name: Nightly Release

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  nightly:
    name: Nightly build & release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build and package portable zip
        shell: pwsh
        run: |
          $version = "nightly"
          ./build-release.ps1 -Version $version -OutputDir artifacts
          $zip = "artifacts/RAWtoJXL-$version-win-x64.zip"
          (Get-FileHash $zip -Algorithm SHA256).Hash | Out-File "$zip.sha256" -Encoding ASCII

      - name: Move nightly tag to current master
        shell: bash
        run: |
          git tag -f nightly
          git push -f origin nightly

      - name: Create or update the Nightly prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%d)
          printf '**Nightly build of master** (%s, commit `%s`).\n\nAutomated build of the latest master. Not a stable release.\n\nAssets: `RAWtoJXL-nightly-win-x64.zip` (+ .sha256). Versioned stable releases are created manually from `v*` tags.' "$DATE" "$COMMIT" > notes.md
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly artifacts/* --clobber
            gh release edit nightly --title "Nightly Build" --prerelease --notes-file notes.md
          else
            gh release create nightly artifacts/* --title "Nightly Build" --prerelease --notes-file notes.md
          fi
