name: Nightly Release

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  nightly:
    name: Nightly build & release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build and package portable zip
        shell: pwsh
        working-directory: RAWtoJXL
        run: |
          $version = "nightly"
          ./build-release.ps1 -Version $version -OutputDir artifacts
          $zip = "artifacts/RAWtoJXL-$version-win-x64.zip"
          (Get-FileHash $zip -Algorithm SHA256).Hash | Out-File "$zip.sha256" -Encoding ASCII

      - name: Tag and publish nightly prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y%m%d)
          TAG="nightly-$DATE"
          COMMIT=$(git rev-parse --short HEAD)
          git tag "$TAG"
          git push origin "$TAG"
          printf '**Nightly build** (%s, commit `%s`).\n\nAutomated build of the latest master. Not a stable release.\n\nAssets: `RAWtoJXL-nightly-win-x64.zip` (+ .sha256).' "$DATE" "$COMMIT" > notes.md
          gh release create "$TAG" RAWtoJXL/artifacts/* --title "Nightly Build $DATE" --prerelease --notes-file notes.md

      - name: Clean up previous nightly tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y%m%d)
          for OLD in $(gh release list --json tagName --jq '.[].tagName' | grep -E '^nightly-[0-9]{8}$' | grep -v "^$TODAY$"); do
            echo "Removing stale nightly release: $OLD"
            gh release delete "$OLD" --cleanup-tag --yes || true
          done
