name: Nightly Release

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  nightly:
    name: Nightly build & release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build and package portable zip
        shell: pwsh
        working-directory: RAWtoJXL
        run: |
          $version = "nightly"
          ./build-release.ps1 -Version $version -OutputDir artifacts
          $zip = "artifacts/RAWtoJXL-$version-win-x64.zip"
          (Get-FileHash $zip -Algorithm SHA256).Hash | Out-File "$zip.sha256" -Encoding ASCII

      - name: Tag and publish nightly prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y%m%d)
          # Unique per run: GitHub permanently protects a tag name once a
          # release has been attached to it (even after the release is
          # deleted), so a fixed daily tag breaks re-runs. The run number
          # guarantees a fresh, never-burned name every time.
          TAG="nightly-$DATE-r${{ github.run_number }}"
          COMMIT=$(git rev-parse --short HEAD)
          git tag "$TAG"
          git push origin "$TAG"
          printf '**Nightly build** (%s, commit `%s`).\n\nAutomated build of the latest master. Not a stable release.\n\nAssets: `RAWtoJXL-nightly-win-x64.zip` (+ .sha256).' "$DATE" "$COMMIT" > notes.md
          gh release create "$TAG" RAWtoJXL/artifacts/* --title "Nightly Build $DATE" --prerelease --notes-file notes.md

      - name: Clean up previous nightly tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEWEST=$(gh release list --json tagName --jq '.[].tagName' | grep -E '^nightly-[0-9]{8}-r[0-9]+$' | sort | tail -n 1)
          for OLD in $(gh release list --json tagName --jq '.[].tagName' | grep -E '^nightly-[0-9]{8}-r[0-9]+$'); do
            if [ "$OLD" != "$NEWEST" ]; then
              echo "Removing stale nightly release: $OLD"
              gh release delete "$OLD" --cleanup-tag --yes || true
            fi
          done
          # Remove the legacy frozen 'nightly' release (its tag name is
          # burned and cannot be reused, so only the release is cleaned).
          if gh release view nightly >/dev/null 2>&1; then
            echo "Removing legacy nightly release"
            gh release delete nightly --cleanup-tag --yes || true
          fi

      - name: Prune old workflow runs and caches
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          CUTOFF=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Deleting workflow runs created before $CUTOFF..."
          for PAGE in 1 2 3; do
            RUNS=$(gh api "repos/$REPO/actions/runs?per_page=100&page=$PAGE" --jq '.workflow_runs[] | select(.created_at < "'"$CUTOFF"'") | .id')
            [ -z "$RUNS" ] && break
            for ID in $RUNS; do
              echo "  deleting run $ID"
              gh api -X DELETE "repos/$REPO/actions/runs/$ID" || true
            done
          done
          echo "Deleting caches last used before $CUTOFF..."
          for ID in $(gh api "repos/$REPO/actions/caches" --paginate --jq '.actions_caches[] | select(.last_used_at == null or .last_used_at < "'"$CUTOFF"'") | .id'); do
            echo "  deleting cache $ID"
            gh api -X DELETE "repos/$REPO/actions/caches/$ID" || true
          done
